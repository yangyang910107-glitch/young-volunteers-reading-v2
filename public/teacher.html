<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Young Volunteers · Teacher</title><link rel="stylesheet" href="/style.css?v=guestqr1"><link rel="stylesheet" href="/stages.css?v=guestqr1"><link rel="stylesheet" href="/ppt-theme.css?v=guestqr1"><link rel="stylesheet" href="/compact.css?v=guestqr1"><link rel="stylesheet" href="/lesson-frame.css?v=guestqr1"><link rel="stylesheet" href="/refine.css?v=guestqr1"><style>.practice-banner{margin:12px 0;padding:12px 16px;border:1px solid #b8cbbb;border-radius:12px;background:#edf3e7;display:grid;gap:5px;font-size:14px}.practice-banner strong{color:#285742}.practice-banner span{color:#52675b}</style><style>.join-qr{margin:12px 0 18px;border:1px solid #c7d6c2;border-radius:16px;background:#fffdf7;padding:12px 18px}.join-qr summary{cursor:pointer;font-weight:800;color:#173e32;font-size:16px}.qr-mode{display:flex;gap:8px;margin:16px 0}.qr-mode button{padding:10px 16px;font-size:13px}.qr-content{display:flex;align-items:center;gap:30px}.qr-content img{width:300px;height:300px;max-width:42vw;object-fit:contain;background:white;flex-shrink:0}.qr-content h2{margin:0 0 8px;font-size:25px}.qr-room{font-weight:800;font-size:24px;letter-spacing:2px}.qr-content p{margin:10px 0}.qr-content strong{display:block;font-size:13px;max-width:400px}.teacher #observer-link{display:none}@media(max-width:650px){.qr-content{flex-direction:column;align-items:flex-start;gap:10px}.qr-content img{max-width:100%;width:270px;height:270px}.qr-mode{flex-wrap:wrap}}</style></head><body class="teacher"><header><span class="brand">♡ YOUNG VOLUNTEERS</span><span id="connection">Connecting…</span></header><main><div class="heading"><p class="eyebrow">ONE CLASS · SIX TEAMS · EVERYONE THINKS</p><h1 id="activity-title">LET’S GET STARTED</h1><div id="steps" class="steps"></div></div><section id="setup" class="join-panel"><h2>Let’s open the room.</h2><form id="room-form"><label>Room Code<input id="code" required maxlength="12" pattern="[A-Za-z0-9]{3,12}"></label><label>Expected Students<input id="expected" type="number" min="1" placeholder="For progress only; no entry limit" value="13"></label><button>START ROOM →</button></form></section><section id="game" hidden><div class="room-line"><span id="room-label"></span><button id="copy" class="quiet">COPY STUDENT LINK</button><a id="student-link" target="_blank"></a><button id="copy-guest" class="quiet">COPY GUEST PRACTICE LINK</button><a id="observer-link" class="quiet" target="_blank">OPEN STUDENT DEMO</a></div><details id="join-qr" class="join-qr"><summary id="qr-summary">SCAN TO JOIN</summary><nav class="qr-mode" aria-label="Choose entry mode"><button id="qr-class" type="button" class="chosen">CLASS STUDENTS</button><button id="qr-guest" type="button" class="quiet">GUEST PRACTICE</button></nav><div class="qr-content"><img id="qr-image" width="300" height="300" alt="Student entry QR code"><div><h2 id="qr-title">CLASS STUDENTS</h2><p id="qr-room" class="qr-room"></p><p id="qr-note"></p><strong id="qr-data-note"></strong><p><button id="qr-copy" type="button" class="quiet">COPY STUDENT LINK</button></p><p id="qr-error" role="alert"></p></div></div></details><section id="lesson-panel" hidden></section><section id="paper-exit" class="paper-exit" hidden></section><section id="record-tools" class="record-tools" hidden><button id="export-class">DOWNLOAD CLASS RECORD · PDF</button><p>Save the class record before restarting the activity.</p></section><section id="demo-panel" class="demo-panel" hidden></section><section id="interaction-guide" class="interaction-guide" hidden></section><section id="progress" class="progress"><p class="eyebrow">LIVE PROGRESS</p><div id="count" class="huge"></div><h2 id="count-label"></h2><p id="connected"></p><div id="roster" class="roster"></div></section><div class="actions"><button id="reveal"></button><button id="next"></button><button id="reset" class="quiet">RESTART ACTIVITY</button></div><p id="stage-note" class="stage-note"></p><div id="results" class="table-results" hidden></div></section><p id="error" role="alert"></p></main><script src="/socket.io/socket.io.js"></script><script src="/content.js?v=guestqr1"></script><script src="/article.js?v=guestqr1"></script><script src="/lesson-content.js?v=guestqr1"></script><script src="/shared.js?v=guestqr1"></script><script src="/marking.js?v=guestqr1"></script><script src="/pdf-lib.min.js?v=guestqr1"></script><script src="/record-pdf.js?v=guestqr1"></script><script src="/explanations.js?v=guestqr1"></script><script src="/lesson-ui.js?v=guestqr1"></script><script src="/teacher.js?v=guestqr1"></script><script src="/ppt-theme.js?v=guestqr1"></script><script src="/lesson-frame.js?v=guestqr1"></script><script src="/qrcode-generator.js?v=guestqr1"></script><script src="/classroom-qr.js?v=guestqr1"></script><script src="/teacher-qr.js?v=guestqr1"></script></body></html>
